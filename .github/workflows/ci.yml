name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit tests mock Prisma at the client boundary, so a dummy URL is
      # enough to construct the client. The build step below never opens a
      # connection either (auth secret checks are skipped during
      # phase-production-build).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit & integration tests (coverage-gated)
        run: bun run test:coverage

      # P2 (production-readiness re-audit) — upload the coverage report as a
      # CI artifact so it's downloadable from the Actions run summary. Lets
      # reviewers inspect line-level coverage without re-running the suite
      # locally. Retained for 7 days to keep storage costs bounded.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      # Launch gate 5 — dependency audit. Fails on high/critical advisories
      # affecting a SHIPPING dependency (direct prod deps +, after the build
      # job runs it again, the traced standalone runtime). Dev-toolchain-only
      # findings are informational.
      - name: Dependency audit (production dependencies)
        run: bun run audit:check

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # NEXTAUTH_SECRET is intentionally absent: the auth module skips its
      # production-secret assertion during phase-production-build, and a
      # build that *requires* a real secret would be a CI smell.
      - name: Build
        run: bun run build

      # L-P1-17 — bundle budget gate. Fails the build if any initial route
      # JS chunk exceeds its budget, so a regression that bloats the bundle
      # (e.g. accidentally importing Recharts into the dashboard) is caught
      # in CI before it ships.
      - name: Bundle budget check
        run: bun run bundle:check

      # Launch gate 5 (strict pass) — re-run the audit now that the traced
      # production runtime exists, so transitive runtime deps are covered.
      - name: Dependency audit (incl. traced runtime)
        run: bun run audit:check

      # Launch gate 11 — demo credentials must be impossible in a production
      # build. Grep the compiled client chunks + server output for the seed
      # email/password; the build ran without NEXT_PUBLIC_DEMO_* (CI has no
      # .env), so the literals cannot have been inlined.
      # Also refuses a stray .env in the standalone output — Next copies it
      # into the deployable artifact when it exists at build time (secrets
      # must be injected at runtime, never baked into the image).
      - name: Verify demo credentials + secrets are absent from the production build
        run: |
          set -e
          if grep -rIl "fernly123\|demo@fernly.app" .next/static .next/standalone/.next/server 2>/dev/null; then
            echo "::error::Demo credentials found in the production build (launch gate 11 / L-P0-12 regression)"
            exit 1
          fi
          if compgen -G ".next/standalone/.env*" > /dev/null; then
            echo "::error::.env file(s) copied into the standalone output — secrets must not ship in the artifact"
            ls -la .next/standalone/.env*
            exit 1
          fi
          echo "OK — no demo credentials or secrets in the production bundle"

  # Launch gate 8 — E2E suite (login, board, messaging) green in CI.
  # Runs against a real app + real Postgres via a service container; the
  # only "secret" needed is a CI-only NEXTAUTH_SECRET (inline below).
  e2e:
    name: e2e (cucumber + selenium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Wait for the DB to accept connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # CI-only value — signs session JWTs for the ephemeral test database.
      NEXTAUTH_SECRET: ci-only-secret-0123456789abcdef
      NEXT_PUBLIC_SEED_DEMO: "1"
      # CI-only demo password for the ephemeral e2e database — hashed into
      # the demo accounts by scripts/seed.js and read back by the cucumber
      # login steps (e2e/steps/common-steps.js). Deliberately not a valid
      # credential anywhere else; the production-build job greps its output
      # for leaked demo creds and this value never reaches that job.
      NEXT_PUBLIC_DEMO_PASSWORD: ci-only-demo-password
      SELENIUM_BROWSER: chrome
      SELENIUM_HEADLESS: "1"
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations + seed
        run: |
          bun run db:deploy
          bun run db:seed

      - name: Start dev server
        run: nohup bun run dev > dev.log 2>&1 &

      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "app is healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy in 120s"; tail -n 50 dev.log; exit 1

      # ubuntu-latest ships Google Chrome; selenium-webdriver 4.x fetches a
      # matching chromedriver via Selenium Manager on first use.
      - name: Run E2E suite
        run: bun run test:e2e

      # Failure forensics: screenshots + URL/h1/toast state for every failed
      # scenario (written by the After hook in e2e/support/world.js).
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump dev server log on failure
        if: failure()
        run: tail -n 200 dev.log || echo "dev.log not found — failure occurred before the dev server started"
