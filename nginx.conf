# L-P1-21 — nginx load balancer config. Passive health checking
# (max_fails + fail_timeout), X-Forwarded-* headers, static asset caching.
#
# PR-25 (production-readiness audit):
#   • /health       — nginx's OWN liveness (static ok; used by the compose
#                     healthcheck). Deliberately does NOT probe upstream, so a
#                     wedged app doesn't cascade into restarting the LB.
#   • /upstream-health — real end-to-end probe (proxies to the app's
#                     /api/health, which checks DB + Redis). Point external
#                     uptime monitors HERE — it is the honest "site is up"
#                     signal; 503 means the app (or its DB) is down.
#   • /_next/static — proxy_hide_header Cache-Control before adding the
#                     immutable header, so responses carry ONE Cache-Control
#                     instead of a duplicated pair.
#
# TLS: this config serves HTTP only — terminate TLS either on a host-level
# proxy (Caddy with automatic HTTPS — see deploy/Caddyfile.production — or
# certbot+nginx) or swap in deploy/nginx-tls.conf.example. The app's HSTS
# header only becomes effective once TLS is terminated in front of this stack.

events {
    worker_connections 1024;
}

http {
    upstream fernly {
        # Docker DNS resolves `fernly-1` to every container of the service
        # (run with `docker compose up -d --scale fernly-1=2` for 2 replicas).
        # OSS nginx resolves the name once at startup; a restarted replica can
        # briefly keep a stale IP until a passive-health failure evicts it.
        server fernly-1:3000;
        max_fails 3;
        fail_timeout 30s;
    }

    server {
        listen 80;
        server_name _;

        # nginx's own liveness — static, no upstream probe (see header).
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Real end-to-end health: app + DB + Redis (PR-25). External monitors
        # and load-balancer pool checks should use this one.
        location = /upstream-health {
            access_log off;
            proxy_pass http://fernly/api/health;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://fernly;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /_next/static/ {
            proxy_pass http://fernly;
            # One Cache-Control, not two: hide whatever the upstream sends
            # before adding the immutable 1-year policy (content-hashed files).
            proxy_hide_header Cache-Control;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
